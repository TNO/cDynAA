before_script:
    # Install required dependencies
    - make requirements

    # Setup SSH for deploying to server
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - >
      if [[ ! -z "$SSH_PRIVATE_KEY" ]]; then
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null;
      fi
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

stages:
    - build-cdynaa
    - test-cdynaa
    - build-pydynaa
    - test-pydynaa

# Build cDynAA
# ============
# Images in dockerhub

# Docker image is Ubuntu 18.04 with Python 3.6 to ensure support
# for older systems
build-cdynaa:18.04-cp36:
    image: rknegjens/netsquidci:18.04-cp36
    stage: build-cdynaa
    only:
        - merge_requests
        - master
        - /^v.*-develop/
        - /^.*-stable/
        - /^v.*-deploy/
    script:
        - make cdynaa
    artifacts:
        when: on_success
        expire_in: 60 min
        untracked: true

